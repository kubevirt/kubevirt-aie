<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 315" width="100%" height="100%" style="background: #ffffff; border-radius: 6px; border: 1px solid #d5e0e4; font-family: 'Red Hat Display', 'DejaVu Sans', sans-serif;">
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#087e8b" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#526571" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#76b900" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ee0000" />
    </marker>
    <filter id="shadow" x="-3%" y="-5%" width="106%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- CONNECTORS -->

  <!-- NVIDIA Forks -> CentOS Stream AIE SIG -->
  <path d="M 200 115 L 255 115" fill="none" stroke="#76b900" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- NVIDIA Forks direct upstream contribution (dashed) -->
  <path d="M 180 145 C 230 175, 380 175, 455 175" fill="none" stroke="#76b900" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-green)"/>

  <!-- CentOS Stream AIE -> Early el10nv packages (Upper Fast Track) -->
  <path d="M 395 100 C 420 60, 440 60, 475 60" fill="none" stroke="#ee0000" stroke-width="2.5" marker-end="url(#arrow-red)"/>

  <!-- CentOS Stream AIE -> Upstream Review (Lower Upstream Track) -->
  <path d="M 395 130 C 420 160, 435 160, 455 160" fill="none" stroke="#ee0000" stroke-width="2.5" marker-end="url(#arrow-red)"/>

  <!-- Early Packages -> kubevirt/kubevirt-aie virt-launcher -->
  <path d="M 655 60 L 785 60" fill="none" stroke="#087e8b" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

  <!-- Upstream Review -> Standard CentOS Stream 10 Packages -->
  <path d="M 605 160 L 640 160" fill="none" stroke="#526571" stroke-width="2" marker-end="url(#arrow-muted)"/>

  <!-- Standard Packages -> kubevirt/kubevirt virt-launcher -->
  <path d="M 770 160 L 785 160" fill="none" stroke="#526571" stroke-width="2.5" marker-end="url(#arrow-muted)"/>

  <!-- NVIDIA stack dependency path to DSX; independent of CentOS packaging. -->
  <path d="M 112 150 V 260 H 785" fill="none" stroke="#76b900" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="425" y="249" text-anchor="middle" font-size="12" font-weight="600" fill="#526571">NVIDIA kernel, QEMU &amp; libvirt dependencies</text>

  <!-- NODES -->

  <!-- 1. NVIDIA Hardware Forks -->
  <g transform="translate(25, 80)" filter="url(#shadow)">
    <rect width="175" height="70" rx="5" fill="#ffffff" stroke="#76b900" stroke-width="2"/>
    <rect width="175" height="4" rx="2" fill="#76b900"/>
    <text x="87" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#172b36">NVIDIA Hardware Forks</text>
    <text x="87" y="47" text-anchor="middle" font-size="12" fill="#526571">Kernel, QEMU &amp; libvirt</text>
    <text x="87" y="61" text-anchor="middle" font-size="12" fill="#76b900" font-weight="600">Day-0 Silicon Patches</text>
  </g>

  <!-- 2. CentOS Stream AIE SIG -->
  <g transform="translate(260, 80)" filter="url(#shadow)">
    <rect width="135" height="70" rx="5" fill="#ffffff" stroke="#ee0000" stroke-width="2"/>
    <rect width="135" height="4" rx="2" fill="#ee0000"/>
    <text x="67" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#172b36">CentOS AIE SIG</text>
    <text x="67" y="44" text-anchor="middle" font-size="12" fill="#ee0000" font-weight="600">Red Hat + NVIDIA</text>
    <text x="67" y="59" text-anchor="middle" font-size="12" fill="#526571">CentOS Stream 10</text>
  </g>

  <!-- 3. Upper: Early Userspace Packages -->
  <g transform="translate(480, 35)" filter="url(#shadow)">
    <rect width="175" height="50" rx="25" fill="#e5f2f2" stroke="#087e8b" stroke-width="1.8"/>
    <text x="87" y="23" text-anchor="middle" font-size="12" font-weight="700" fill="#087e8b">early el10nv packages</text>
    <text x="87" y="38" text-anchor="middle" font-size="12" fill="#526571">QEMU 9.2 · libvirt 10.10</text>
  </g>

  <!-- 4. Lower: Upstream Review -->
  <g transform="translate(460, 133)" filter="url(#shadow)">
    <rect width="145" height="54" rx="5" fill="#ffffff" stroke="#8da1ab" stroke-width="1.5"/>
    <text x="72" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#172b36">Upstream Review</text>
    <text x="72" y="42" text-anchor="middle" font-size="12" fill="#526571">Linux · QEMU · libvirt</text>
  </g>

  <!-- 5. Lower: Standard CentOS Stream 10 Packages -->
  <g transform="translate(645, 133)" filter="url(#shadow)">
    <rect width="125" height="54" rx="27" fill="#f7f9fa" stroke="#8da1ab" stroke-width="1.5"/>
    <text x="62" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#172b36">standard RPMs</text>
    <text x="62" y="41" text-anchor="middle" font-size="12" fill="#526571">CentOS Stream 10</text>
  </g>

  <!-- 6. Fast Prototyping: kubevirt/kubevirt-aie (release-1.8-aie-nv) -->
  <g transform="translate(790, 27)" filter="url(#shadow)">
    <rect width="280" height="66" rx="6" fill="#e5f2f2" stroke="#087e8b" stroke-width="2"/>
    <rect x="8" y="-9" width="155" height="17" rx="3" fill="#087e8b"/>
    <text x="85" y="3" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">FAST PROTOTYPING</text>
    <text x="140" y="27" text-anchor="middle" font-size="16" font-weight="700" fill="#087e8b">kubevirt/kubevirt-aie</text>
    <text x="140" y="43" text-anchor="middle" font-size="13" font-weight="600" fill="#172b36">release-1.8-aie-nv</text>
    <text x="140" y="58" text-anchor="middle" font-size="12" fill="#526571">Day-0 hardware validation</text>
  </g>

  <!-- 7. Permanent Off-Ramp: kubevirt/kubevirt (main) -->
  <g transform="translate(790, 127)" filter="url(#shadow)">
    <rect width="280" height="66" rx="6" fill="#122a35" stroke="#087e8b" stroke-width="2"/>
    <rect x="8" y="-9" width="180" height="17" rx="3" fill="#2563eb"/>
    <text x="98" y="3" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">PERMANENT OFF-RAMP</text>
    <text x="140" y="27" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">kubevirt/kubevirt</text>
    <text x="140" y="43" text-anchor="middle" font-size="13" font-weight="600" fill="#a6dfda">main</text>
    <text x="140" y="58" text-anchor="middle" font-size="12" fill="#c1d0d6">Standard release · fork retired</text>
  </g>

  <!-- 8. NVIDIA DSX KubeVirt: NVIDIA-specific KubeVirt integration branches (release-1.7-aie-nv) -->
  <g transform="translate(790, 222)" filter="url(#shadow)">
    <rect width="280" height="80" rx="6" fill="#f1f7e8" stroke="#76b900" stroke-width="2"/>
    <rect x="8" y="-9" width="175" height="17" rx="3" fill="#76b900"/>
    <text x="95" y="3" text-anchor="middle" font-size="12" font-weight="700" fill="#172b36">NVIDIA DSX KubeVirt</text>
    <text x="140" y="29" text-anchor="middle" font-size="16" font-weight="700" fill="#172b36">kubevirt/kubevirt-aie</text>
    <text x="140" y="47" text-anchor="middle" font-size="13" font-weight="600" fill="#172b36">release-1.7-aie-nv</text>
    <text x="140" y="65" text-anchor="middle" font-size="12" fill="#526571">NVIDIA-specific integration branches</text>
  </g>

</svg>
